name: ニュース自動収集

on:
  schedule:
    - cron: "*/15 * * * *" # 15分ごとに実行
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: ニュースを収集
        # 追加したスクリプトを使って hnrss / AWS / Azure / GitHub 等のフィードを収集
        run: python3 scripts/fetch_feeds.py

      - name: "デバッグ: data.json を表示"
        run: |
          echo "--- data.json (head) ---"
          head -n 80 docs/data.json || true
          echo "--- data.json (tail) ---"
          tail -n 80 docs/data.json || true

      - name: "デバッグ: git 差分を表示"
        run: |
          git add docs/data.json || true
          echo "git status:";
          git status --porcelain || true
          echo "git diff (staged):";
          git --no-pager diff --staged || true

      - name: Upload data.json as artifact (debug)
        uses: actions/upload-artifact@v4
        with:
          name: data.json
          path: docs/data.json

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "ニュースデータ更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
